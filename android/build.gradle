buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.8.0"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${project.properties["BlePlx_kotlinVersion"]}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["BlePlx_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["BlePlx_" + name]).toInteger()
}

android {
  namespace "com.bleplx"

  sourceSets {
    main {
      manifest.srcFile "src/main/AndroidManifestNew.xml"
      java.srcDirs += "src/main/kotlin"
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'no.nordicsemi.android:ble:2.11.0'
  implementation 'no.nordicsemi.android:ble-ktx:2.11.0'
  implementation 'no.nordicsemi.android.support.v18:scanner:1.6.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'

  testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
  testImplementation 'io.mockk:mockk:1.13.8'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}

react {
  jsRootDir = file("../src/")
  libraryName = "BlePlx"
  codegenJavaPackageName = "com.bleplx"
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()
}
